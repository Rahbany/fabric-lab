frr defaults traditional
hostname spine1
!
interface lo
 ip address 10.0.0.1/32
 ip ospf area 0
!
interface eth1
 ip address 10.1.0.1/31
 ip ospf area 0
 ip ospf network point-to-point
!
interface eth2
 ip address 10.1.0.5/31
 ip ospf area 0
 ip ospf network point-to-point
!
router ospf
 ospf router-id 10.0.0.1
