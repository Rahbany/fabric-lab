frr defaults traditional
hostname spine2
!
interface lo
 ip address 10.0.0.2/32
 ip ospf area 0
!
interface eth1
 ip address 10.1.0.3/31
 ip ospf area 0
 ip ospf network point-to-point
!
interface eth2
 ip address 10.1.0.7/31
 ip ospf area 0
 ip ospf network point-to-point
!
router ospf
 ospf router-id 10.0.0.2
